<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Fravora TV</title>
  <script src="https://accounts.google.com/gsi/client"></script>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e0e10;
      color: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    p#status {
      color: #b3b3b3;
      font-size: 0.95rem;
      line-height: 1.4;
      min-height: 1.4em;
      margin-bottom: 28px;
    }
    #pairingCode {
      display: none;
      margin: -12px 0 28px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #f2f2f2;
    }
    button {
      background: #4f8cff;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connect Fravora TV</h1>
    <p id="status">Checking your pairing code…</p>
    <p id="pairingCode"></p>
    <button id="connectBtn" onclick="startPairing()" disabled>Connect</button>
    <button id="retryBtn" onclick="retryPairing()" hidden>Try again</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    // ---- REPLACE with your project's actual Firebase config ----
    // Firebase Console -> Project settings -> General -> Your apps -> SDK setup and configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBhXal-ibRtoTPKVg9TPZCgQrMUlh88DPM",
      authDomain: "fravora-c5b45.firebaseapp.com",
      projectId: "fravora-c5b45",
      storageBucket: "fravora-c5b45.firebasestorage.app",
      messagingSenderId: "131742204232",
      appId: "1:131742204232:web:468c81104777ae26ecf37d"
    };

    // ---- REPLACE with your actual Web OAuth Client ID ----
    const WEB_CLIENT_ID = "131742204232-bubc4sdu428f1rrt8khrjgt39541qq9c.apps.googleusercontent.com";
    const DROPBOX_CLIENT_ID = "3aogvun5of0gd83";
    const DROPBOX_SCOPE = "account_info.read files.metadata.read files.content.read";
    const REDIRECT_URI = "https://fravora.app/tv/pair.html";
    const PAIRING_CODE_PATTERN = /^[A-Za-z0-9]{10,16}$/;
    const CODE_CHALLENGE_PATTERN = /^[A-Za-z0-9_-]{43}$/;

    // Keys match the app's GoogleAuthorizationProvider enum.
    const GOOGLE_PROVIDERS = {
      PHOTOS: {
        label: "Google Photos",
        scope: "https://www.googleapis.com/auth/photospicker.mediaitems.readonly"
      },
      DRIVE: {
        label: "Google Drive",
        scope: "https://www.googleapis.com/auth/drive.readonly"
      }
    };
    let googleProvider = null;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const statusEl = document.getElementById("status");
    const pairingCodeEl = document.getElementById("pairingCode");
    const btnEl = document.getElementById("connectBtn");
    const retryBtn = document.getElementById("retryBtn");

    const params = new URLSearchParams(window.location.search);
    const state = params.get("state");
    const isDropboxReturn = Boolean(state && state.startsWith("DROPBOX:"));
    const isDropboxStart = !isDropboxReturn && params.get("provider") === "DROPBOX";
    let pairingCode = isDropboxReturn ? state.slice("DROPBOX:".length) : params.get("code");

    if (isDropboxReturn && !pairingCode) {
      try {
        pairingCode = sessionStorage.getItem("dropboxPairingCode");
      } catch (error) {
        console.warn("Couldn't read the saved pairing code", error);
      }
    }

    const isDropboxFlow = isDropboxStart || isDropboxReturn;
    const challenge = params.get("challenge");
    const hasValidPairingCode = PAIRING_CODE_PATTERN.test(pairingCode || "");
    const hasValidChallenge = !isDropboxStart || CODE_CHALLENGE_PATTERN.test(challenge || "");

    if (!hasValidPairingCode || !hasValidChallenge) {
      statusEl.textContent = "This pairing link is invalid. Please scan the QR code shown on your TV again.";
      clearReturnState();
    } else if (isDropboxStart) {
      statusEl.textContent = "Continue to Dropbox and sign in with the account you want your TV to use. Confirm that this code matches your TV:";
      pairingCodeEl.textContent = pairingCode.match(/.{1,4}/g).join("-");
      pairingCodeEl.style.display = "block";
      btnEl.textContent = "Continue to Dropbox";
    } else if (isDropboxReturn) {
      statusEl.textContent = "Finishing your Dropbox connection…";
      btnEl.style.display = "none";
    }

    // Deferred to terminal outcomes only, so a transient failure can still be retried or reloaded.
    function clearReturnState() {
      if (!isDropboxReturn) return;
      try {
        sessionStorage.removeItem("dropboxPairingCode");
      } catch (error) {
        console.warn("Couldn't clear the saved pairing code", error);
      }
      history.replaceState(null, "", location.pathname);
    }

    function showTerminal(message) {
      statusEl.textContent = message;
      btnEl.disabled = true;
      retryBtn.hidden = true;
      clearReturnState();
    }

    function showRetryable(message) {
      statusEl.textContent = message;
      btnEl.disabled = true;
      retryBtn.hidden = false;
    }

    function showExpired() {
      showTerminal("This code has expired. Scan the new QR code on your TV.");
    }

    function showAlreadyUsed() {
      showTerminal("This code has already been used. Check your TV.");
    }

    window.retryPairing = () => {
      retryBtn.hidden = true;
      statusEl.textContent = "Trying again\u2026";
      initializePairing();
    };

    async function initializePairing() {
      if (!hasValidPairingCode || !hasValidChallenge) return;

      try {
        await signInAnonymously(auth);
        const pairingRef = doc(db, "pairings", pairingCode);
        const pairingSnapshot = await getDoc(pairingRef);
        const pairingData = pairingSnapshot.data();

        // The TV creates Dropbox documents with authCode and authError already present but null,
        // so only a non-null value means the document has been used.
        if (!pairingSnapshot.exists()) {
          showExpired();
          return;
        }

        if (pairingData.authCode != null
            || pairingData.authError != null
            || (!isDropboxFlow && pairingData.accessToken != null)) {
          showAlreadyUsed();
          return;
        }

        if (isDropboxReturn) {
          await finishDropboxPairing(pairingRef);
          return;
        }

        if (isDropboxStart) {
          btnEl.disabled = false;
          return;
        }

        // Taken from the document, not the URL, so a crafted link cannot widen the requested scope.
        const providerName = pairingData.provider;
        const resolved = Object.hasOwn(GOOGLE_PROVIDERS, providerName) ? GOOGLE_PROVIDERS[providerName] : null;
        if (!resolved) {
          showTerminal("This pairing link is invalid. Please scan the QR code shown on your TV again.");
          return;
        }

        googleProvider = resolved;
        statusEl.textContent = `Tap the button below and sign in with the Google account you want your TV to use for ${resolved.label}.`;
        btnEl.textContent = `Connect to ${resolved.label}`;
        btnEl.disabled = false;
      } catch (error) {
        console.error("Pairing setup failed", error);
        showRetryable("Couldn't set up a secure connection. Check your connection, then tap Try again or reload the page.");
      }
    }

    async function finishDropboxPairing(pairingRef) {
      const dropboxError = params.get("error");
      const denied = dropboxError === "access_denied";
      const authorizationCode = params.get("code");

      if ((dropboxError && !denied) || (!denied && (!authorizationCode || authorizationCode.length > 512))) {
        showTerminal("Dropbox sign-in couldn't be completed. Please scan the QR code on your TV and try again.");
        return;
      }

      try {
        if (denied) {
          await updateDoc(pairingRef, { authError: "denied" });
        } else {
          await updateDoc(pairingRef, { authCode: authorizationCode });
        }
      } catch (error) {
        // The rules reject the write once the document is gone or more than 15 minutes old.
        if (error && (error.code === "permission-denied" || error.code === "not-found")) {
          showExpired();
          return;
        }
        console.error("Couldn't relay the Dropbox result", error);
        showRetryable("Couldn't send your connection to the TV. Check your connection, then tap Try again or reload the page.");
        return;
      }

      showTerminal(denied
        ? "Access was declined. Return to your TV."
        : "You're signed in. Return to your TV.");
    }

    initializePairing();

    window.startPairing = () => {
      if (!hasValidPairingCode || btnEl.disabled) return;

      if (isDropboxStart) {
        try {
          sessionStorage.setItem("dropboxPairingCode", pairingCode);
        } catch (error) {
          console.warn("Couldn't save the pairing code", error);
        }

        const authorizeUrl = new URL("https://www.dropbox.com/oauth2/authorize");
        authorizeUrl.searchParams.set("client_id", DROPBOX_CLIENT_ID);
        authorizeUrl.searchParams.set("response_type", "code");
        authorizeUrl.searchParams.set("redirect_uri", REDIRECT_URI);
        authorizeUrl.searchParams.set("token_access_type", "offline");
        authorizeUrl.searchParams.set("scope", DROPBOX_SCOPE);
        authorizeUrl.searchParams.set("state", `DROPBOX:${pairingCode}`);
        authorizeUrl.searchParams.set("code_challenge", challenge);
        authorizeUrl.searchParams.set("code_challenge_method", "S256");
        if (params.get("reapprove") === "1") {
          authorizeUrl.searchParams.set("force_reapprove", "true");
          authorizeUrl.searchParams.set("prompt", "login");
        }
        window.location.href = authorizeUrl.toString();
        return;
      }

      btnEl.disabled = true;
      statusEl.textContent = "Opening Google sign-in…";

      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: WEB_CLIENT_ID,
        scope: googleProvider.scope,
        callback: async (response) => {
          if (response.error) {
            console.error("Auth error", response);
            statusEl.textContent = "Permission wasn't granted. Tap the button to try again.";
            btnEl.disabled = false;
            return;
          }

          if (!auth.currentUser) {
            statusEl.textContent = "Connection wasn't ready. Please reload the page and try again.";
            btnEl.disabled = false;
            return;
          }

          const pairingRef = doc(db, "pairings", pairingCode);
          // GIS returns expires_in as seconds (string or number); the TV uses it for token expiry.
          const expiresIn = Number.parseInt(response.expires_in, 10);
          const payload = { accessToken: response.access_token };
          if (Number.isFinite(expiresIn) && expiresIn > 0) {
            payload.expiresIn = expiresIn;
          }

          try {
            try {
              await updateDoc(pairingRef, payload);
            } catch (e) {
              // Rules may not allow expiresIn yet; the token alone is enough, the TV falls back to 50 minutes.
              if (e && e.code === "permission-denied" && "expiresIn" in payload) {
                console.warn("expiresIn rejected by rules; retrying with accessToken only", e);
                await updateDoc(pairingRef, { accessToken: response.access_token });
              } else {
                throw e;
              }
            }
            statusEl.textContent = "Success! You can now look at your TV.";
          } catch (e) {
            console.error("Firestore error", e);
            statusEl.textContent = "Something went wrong sending your connection to the TV. Please try again.";
            btnEl.disabled = false;
          }
        }
      });

      tokenClient.requestAccessToken();
    };
  </script>
</body>
</html>
