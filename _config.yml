  - vendor/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - 2-week-roadmap.md
  - SEARCH_CONSOLE_INDEXING_CHECKLIST.md
  - LOCAL_CONTENT_SOURCES.md
  - update-sitemap-dates.ps1

webrick: {}

# Static asset caching is set via hosting config when deployed. This keeps assets re-usable on repeat visits.

